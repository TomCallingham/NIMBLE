[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nimble"
version = "0.0.1"
authors = [
  { name = "Nabeel Rehemtulla ", email = "tom.m.callingham@gmail.com" },
  { name = "Tom Callingham", email = "tom.m.callingham@gmail.com" },
]

description = "A package to run NIMBLE. Original (and the hardwork) by Nabeel, small tweaks by TomC."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = ["numpy", "astropy"]

[tool.setuptools.packages.find]
where = ["."]

